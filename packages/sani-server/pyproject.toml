[project]
name = "sani-server"
version = "0.1.0"
description = "Sani' Studio server - FastAPI + WebSocket transport over the agent core"
requires-python = ">=3.11"
dependencies = [
    "sani-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sani_server"]

[tool.uv.sources]
sani-core = { workspace = true }
