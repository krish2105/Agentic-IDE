[project]
name = "sani-studio"
version = "0.1.0"
description = "Sani' Studio - a dual-client agentic IDE"
requires-python = ">=3.11"
dependencies = [
    "sani-core",
    "sani-server",
]

[project.optional-dependencies]
# Production installs opt in explicitly: `uv sync --no-dev --extra all`.
# The dev group also pulls these so the test suite exercises them, but a
# deployment must not depend on a dev group being present.
redis = ["sani-server[redis]"]
rag = ["sani-core[rag]"]
browser = ["sani-core[browser]"]
litellm = ["sani-core[litellm]"]
pgvector = ["sani-core[pgvector]"]
all = ["sani-server[redis]", "sani-core[rag]", "sani-core[browser]", "sani-core[pgvector]"]

[tool.uv]
package = false

[tool.uv.workspace]
# Listed rather than globbed: packages/ also holds the shared TypeScript client,
# which uv would otherwise try to read as a Python project.
members = ["packages/sani-core", "packages/sani-server"]

[tool.uv.sources]
sani-core = { workspace = true }
sani-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Optional runtime extras, always present for the test suite so the
    # Redis-backed and RAG paths are exercised rather than merely written.
    "redis>=5.2",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "playwright>=1.49",
    "asyncpg>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:sani_.*"]
